name: Bug report
description: Something is broken or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: 0.1.0-beta
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you playing?
      options:
        - Single player
        - Multiplayer server
    validations:
      required: true
  - type: input
    id: class
    attributes:
      label: Class and level
      placeholder: Necromancer, level 42
  - type: textarea
    id: log
    attributes:
      label: Crash report or log
      description: If the game crashed, paste the crash report or attach logs/latest.log
      render: text
  - type: input
    id: mods
    attributes:
      label: Other mods
      description: Any other mods you play with
