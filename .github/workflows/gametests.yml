# Runs the game tests (./gradlew runGameTestServer) every time something is pushed to main, and on pull requests.
# If a test fails, the run is red on GitHub and the server log is attached to the run
name: Game tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gametests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run game tests
        run: ./gradlew runGameTestServer

      - name: Attach server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-log
          path: run/logs/
